# lang: YAML, file: rdp-a.yml, target: GitHub Actions / Windows runner

name: XENON RDP

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */5 * * *'

jobs:
  rdp:
    runs-on: windows-latest
    timeout-minutes: 350

    steps:
      - name: Set RDP password
        shell: powershell
        run: |
          $user = "runneradmin"
          $password = "${{ secrets.RDP_PASSWORD }}"

          if (-not (Get-LocalUser -Name $user -ErrorAction SilentlyContinue)) {
            net user $user $password /add 2>&1 | Out-Null
          } else {
            net user $user $password 2>&1 | Out-Null
          }

          $admins = net localgroup Administrators
          if ($admins -notmatch $user) {
            net localgroup Administrators $user /add 2>&1 | Out-Null
          }

      - name: Enable RDP
        shell: powershell
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' `
            -Name fDenyTSConnections -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
            -Name UserAuthentication -Value 1

      - name: Install Tailscale
        shell: powershell
        run: |
          Invoke-WebRequest -Uri "https://pkgs.tailscale.com/stable/tailscale-setup-latest.exe" `
            -OutFile "$env:TEMP\ts.exe"
          Start-Process "$env:TEMP\ts.exe" -ArgumentList "/S" -Wait

      - name: Connect Tailscale
        shell: powershell
        run: |
          $env:PATH += ";C:\Program Files\Tailscale"
          tailscale up --authkey="${{ secrets.TAILSCALE_AUTH_KEY }}" --hostname="rdp-slot-a"
          Start-Sleep -Seconds 10
          tailscale ip -4

      - name: Keep alive
        shell: powershell
        run: |
          $end = (Get-Date).AddMinutes(350)
          while ((Get-Date) -lt $end) { Start-Sleep -Seconds 30 }
