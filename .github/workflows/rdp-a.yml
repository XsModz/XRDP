# lang: YAML, file: rdp-a.yml, target: GitHub Actions / Windows runner

name: RDP Slot A

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */5 * * *'

jobs:
  rdp:
    runs-on: windows-latest
    timeout-minutes: 350

    steps:
      - name: Generate and set RDP password
        shell: powershell
        run: |
          $suffix = -join ((48..57) + (65..90) + (97..122) | Get-Random -Count 12 | ForEach-Object { [char]$_ })
          $pass = "XC$suffix"
          Write-Output "Generated RDP password with prefix XC"

          $sec = ConvertTo-SecureString $pass -AsPlainText -Force
          New-LocalUser -Name "rdpuser" -Password $sec -FullName "RDP User" -Description "RDP" -ErrorAction SilentlyContinue
          Add-LocalGroupMember -Group "Administrators" -Member "rdpuser" -ErrorAction SilentlyContinue
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member "rdpuser" -ErrorAction SilentlyContinue

          # Also set on existing runneradmin just in case
          $user = Get-LocalUser -Name "runneradmin" -ErrorAction SilentlyContinue
          if ($user) {
            $user | Set-LocalUser -Password $sec
          }

          # Save password to file so next step can read it
          $pass | Out-File -FilePath "$env:TEMP\rdppass.txt" -Encoding utf8

      - name: Enable RDP
        shell: powershell
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' `
            -Name fDenyTSConnections -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
            -Name UserAuthentication -Value 1

      - name: Install Tailscale
        shell: powershell
        run: |
          Invoke-WebRequest -Uri "https://pkgs.tailscale.com/stable/tailscale-setup-latest.exe" `
            -OutFile "$env:TEMP\ts.exe"
          Start-Process "$env:TEMP\ts.exe" -ArgumentList "/S" -Wait

      - name: Connect Tailscale
        shell: powershell
        run: |
          $env:PATH += ";C:\Program Files\Tailscale"
          tailscale up --authkey="${{ secrets.TAILSCALE_AUTH_KEY }}" --hostname="rdp-slot-a"
          Start-Sleep -Seconds 10
          tailscale ip -4

      - name: Print credentials
        shell: powershell
        run: |
          $pass = Get-Content "$env:TEMP\rdppass.txt" -Raw
          $ip = & "C:\Program Files\Tailscale\tailscale.exe" ip -4
          Write-Output "==============================="
          Write-Output "  RDP USERNAME : rdpuser"
          Write-Output "  RDP PASSWORD : $pass"
          Write-Output "  TAILSCALE IP : $ip"
          Write-Output "==============================="

      - name: Keep alive
        shell: powershell
        run: |
          $end = (Get-Date).AddMinutes(350)
          while ((Get-Date) -lt $end) { Start-Sleep -Seconds 30 }
